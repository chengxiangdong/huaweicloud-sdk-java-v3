name: Publish to GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          server-id: github        # 必须与 pom.xml 中 distributionManagement 的 id 一致
          settings-path: ${{ github.workspace }}

      - name: Build and Publish with Maven
        run: mvn -B clean deploy -DskipTests -Dgpg.skip=true -DaltDeploymentRepository=github::https://maven.pkg.github.com/chengxiangdong/huaweicloud-sdk-java-v3 -s ${{ github.workspace }}/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
